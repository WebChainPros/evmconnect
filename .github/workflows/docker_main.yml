name: Docker Main Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # firefly-evmconnect를 서브디렉토리로 체크아웃
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: firefly-evmconnect
          fetch-depth: 0

      # firefly-transaction-manager를 형제 디렉토리로 체크아웃
      - uses: actions/checkout@v4
        with:
          repository: WebChainPros/transaction-manager
          ref: custom-1.5
          path: firefly-transaction-manager

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag
        id: build_tag_generator
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          RELEASE_TAG=$(curl https://api.github.com/repos/${{ github.repository }}/releases/latest -s | jq .tag_name -r)
          if [ "$RELEASE_TAG" = "null" ] || [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v1.5.0"
          fi
          BUILD_TAG=$RELEASE_TAG-$(date +"%Y%m%d")-$GITHUB_RUN_NUMBER
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./firefly-evmconnect/Dockerfile.custom
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/${{ steps.build_tag_generator.outputs.IMAGE_NAME }}:${{ steps.build_tag_generator.outputs.BUILD_TAG }},ghcr.io/${{ steps.build_tag_generator.outputs.IMAGE_NAME }}:head
          labels: |
            commit=${{ github.sha }}
            build_date=${{ steps.build_tag_generator.outputs.BUILD_DATE }}
            tag=${{ steps.build_tag_generator.outputs.BUILD_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.build_tag_generator.outputs.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.build_tag_generator.outputs.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.build_tag_generator.outputs.BUILD_TAG }}
            GIT_REF=${{ github.ref }}